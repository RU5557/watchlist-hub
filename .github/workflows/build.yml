name: Build Android Wrapper APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Build Debug APK via Gradle
        run: |
          mkdir -p app/src/main/java/com/watchlist/hub
          mkdir -p app/src/main/res
          mv MainActivity.kt app/src/main/java/com/watchlist/hub/
          mv AndroidManifest.xml app/src/main/
          mv build.gradle.kts app/
          gradle wrapper
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
