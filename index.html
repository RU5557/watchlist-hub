<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f172a">
    <title>Watchlist Hub</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="manifest" href="./manifest.json">
    <link rel="icon" type="image/svg+xml" href="./favicon.svg">
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(() => {});
        }
    </script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans">
    <div class="max-w-4xl mx-auto p-4">
        <header class="flex justify-between items-center mb-6 border-b border-slate-800 pb-4">
            <h1 class="text-2xl font-bold bg-gradient-to-r from-indigo-400 to-cyan-400 bg-clip-text text-transparent">Watchlist Hub</h1>
            <button id="settingsBtn" class="bg-slate-800 px-3 py-1.5 rounded-lg text-sm hover:bg-slate-700 transition">Settings</button>
        </header>

        <div id="authBanner" class="hidden mb-4 p-3 rounded-lg text-sm"></div>
        <div id="loadingState" class="hidden text-center py-12">
            <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-slate-700 border-t-indigo-400"></div>
            <p class="mt-3 text-slate-400">Memuat data...</p>
        </div>

        <!-- Continue Watching -->
        <section id="continueWatchingSection" class="hidden mb-8">
            <h2 class="text-lg font-semibold mb-3 text-slate-300">Continue Watching</h2>
            <div id="continueWatchingGrid" class="grid grid-cols-3 sm:grid-cols-3 md:grid-cols-3 gap-3"></div>
        </section>

        <!-- My Watchlist (status: watching) -->
        <section id="watchlistSection" class="hidden mb-8">
            <h2 class="text-lg font-semibold mb-3 text-slate-300">My Watchlist</h2>
            <div id="watchlistGrid" class="grid grid-cols-3 sm:grid-cols-3 md:grid-cols-3 gap-3"></div>
        </section>

        <!-- Plan to Watch (status: plantowatch) -->
        <section id="planToWatchSection" class="hidden">
            <h2 class="text-lg font-semibold mb-3 text-slate-300">Plan to Watch</h2>
            <div id="planToWatchGrid" class="grid grid-cols-3 sm:grid-cols-3 md:grid-cols-3 gap-3"></div>
        </section>
    </div>

    <!-- Auth Modal -->
    <div id="authModal" class="fixed inset-0 bg-black/80 hidden items-center justify-center p-4 z-50">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-md w-full p-6 relative">
            <button id="closeAuth" class="absolute top-4 right-4 text-slate-400 hover:text-white text-2xl">&times;</button>
            <h3 class="text-xl font-bold mb-2">Login ke SIMKL</h3>
            <p class="text-sm text-slate-400 mb-6">Daftar app di <a href="https://simkl.com/settings/developer/" target="_blank" class="text-indigo-400 hover:underline">SIMKL Developer</a> pilih <strong>Mobile/Desktop/Browser Apps</strong></p>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-1">Client ID</label>
                    <input type="text" id="clientIdInput" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <div class="text-xs text-slate-500 bg-slate-800/50 p-2 rounded">
                    Redirect URI: <code class="text-slate-300" id="redirectUriDisplay"></code>
                </div>
            </div>
            <div class="mt-6 flex flex-col gap-3">
                <button id="loginBtn" class="w-full bg-indigo-600 hover:bg-indigo-500 py-3 px-4 rounded-xl font-medium text-sm transition">Login ke SIMKL</button>
            </div>
            <p id="authStatus" class="mt-3 text-xs text-center hidden"></p>
        </div>
    </div>

    <!-- Settings Modal -->
    <div id="settingsModal" class="fixed inset-0 bg-black/80 hidden items-center justify-center p-4 z-50">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-md w-full p-6 relative">
            <button id="closeSettings" class="absolute top-4 right-4 text-slate-400 hover:text-white text-2xl">&times;</button>
            <h3 class="text-xl font-bold mb-6">Pengaturan</h3>
            
            <div class="space-y-4">
                <div>
                    <p class="text-sm font-medium text-slate-300 mb-2">Status</p>
                    <div class="bg-slate-800/50 p-3 rounded text-sm">
                        <div class="flex items-center gap-2">
                            <div id="statusBadge" class="w-2 h-2 rounded-full bg-red-500"></div>
                            <span id="statusText">Belum login</span>
                        </div>
                        <p id="clientDisplay" class="text-xs text-slate-500 mt-2"></p>
                    </div>
                </div>
            </div>
            <div class="mt-6 flex gap-3">
                <button id="logoutBtn" class="flex-1 bg-red-700 hover:bg-red-600 py-2.5 px-4 rounded-xl font-medium text-sm transition" style="display:none;">Logout</button>
                <button id="loginAgainBtn" class="flex-1 bg-indigo-600 hover:bg-indigo-500 py-2.5 px-4 rounded-xl font-medium text-sm transition" style="display:none;">Login Ulang</button>
            </div>
        </div>
    </div>

    <!-- Action Modal -->
    <div id="actionModal" class="fixed inset-0 bg-black/80 hidden items-center justify-center p-4 z-50">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-md w-full p-6 relative max-h-[90vh] overflow-y-auto">
            <button id="closeModal" class="absolute top-4 right-4 text-slate-400 hover:text-white text-2xl">&times;</button>
            <h3 id="modalTitle" class="text-lg font-bold mb-1 pr-8"></h3>
            <p id="modalType" class="text-xs text-slate-400 mb-3"></p>
            <div id="modalMetadata" class="mb-3"></div>
            <p id="modalOverview" class="text-sm text-slate-400 mb-6"></p>
            <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-3">Buka di Aplikasi:</p>
            <div class="grid grid-cols-2 gap-3">
                <button data-app="stremio" class="app-btn bg-indigo-600 hover:bg-indigo-500 py-2.5 px-4 rounded-xl font-medium text-sm transition">Stremio</button>
                <button data-app="nuvio" class="app-btn bg-cyan-600 hover:bg-cyan-500 py-2.5 px-4 rounded-xl font-medium text-sm transition">Nuvio</button>
                <button data-app="cloudstream" class="app-btn bg-emerald-600 hover:bg-emerald-500 py-2.5 px-4 rounded-xl font-medium text-sm transition">Cloudstream</button>
                <button data-app="netflix" class="app-btn bg-red-600 hover:bg-red-500 py-2.5 px-4 rounded-xl font-medium text-sm transition">Netflix</button>
            </div>
        </div>
    </div>

    <script>
        // ===== HELPER =====
        const $ = sel => document.querySelector(sel);
        const $$ = sel => document.querySelectorAll(sel);

        // ===== KONFIGURASI =====
        const SIMKL_BASE = 'https://api.simkl.com';
        const SIMKL_AUTH = 'https://simkl.com/oauth2';
        const REDIRECT_URI = window.location.origin + window.location.pathname.replace(/\/[^\/]*$/, '');
        const APP_NAME = 'watchlist-hub';
        const APP_VERSION = '1.0';

        $('#redirectUriDisplay').textContent = REDIRECT_URI;

        const APP_INTENTS = {
            stremio: 'intent://search?q={q}#Intent;package=com.stremio.one;end;',
            nuvio: 'intent://search?q={q}#Intent;package=com.nuvio.app;end;',
            cloudstream: 'intent://search?q={q}#Intent;package=com.lagradost.cloudstream3;end;',
            netflix: 'https://www.netflix.com/search?q={q}'
        };

        // ===== STATE =====
        let auth = { clientId: '', accessToken: '', refreshToken: '', tokenExpiry: 0 };
        let selectedItem = null;

        // ===== PKCE =====
        async function generatePKCE() {
            const bytes = crypto.getRandomValues(new Uint8Array(32));
            const base64url = bytes => btoa(String.fromCharCode(...bytes)).replace(/[+/=]/g, c => ({'+':'-','/':'_','=':''}[c]));
            const verifier = base64url(bytes);
            const challenge = base64url(new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier))));
            return { verifier, challenge };
        }

        async function startLogin() {
            const clientId = $('#clientIdInput').value.trim();
            if (!clientId) { showAuthStatus('Client ID diperlukan', 'error'); return; }

            auth.clientId = clientId;
            const { verifier, challenge } = await generatePKCE();
            const state = crypto.randomUUID();

            localStorage.setItem('simkl_client_id', clientId);
            localStorage.setItem('simkl_pkce', JSON.stringify({ verifier, state }));

            const url = new URL(`${SIMKL_AUTH}/authorize`);
            url.searchParams.set('client_id', clientId);
            url.searchParams.set('redirect_uri', REDIRECT_URI);
            url.searchParams.set('response_type', 'code');
            url.searchParams.set('state', state);
            url.searchParams.set('code_challenge', challenge);
            url.searchParams.set('code_challenge_method', 'S256');
            url.searchParams.set('scope', 'media:read media:write');

            $('#authModal').classList.add('hidden');
            window.location.href = url.toString();
        }

        async function handleCallback() {
            const params = new URLSearchParams(window.location.search);
            const code = params.get('code');
            const returnedState = params.get('state');

            window.history.replaceState({}, '', REDIRECT_URI);

            if (!code) return;

            let pkce = null;
            try { pkce = JSON.parse(localStorage.getItem('simkl_pkce') || 'null'); } catch {}

            if (!pkce || pkce.state !== returnedState) {
                showBanner('Login gagal: state mismatch', 'error');
                return;
            }

            showLoading(true);
            const clientId = localStorage.getItem('simkl_client_id');

            try {
                const res = await fetch(`${SIMKL_BASE}/oauth2/token`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        client_id: clientId,
                        redirect_uri: REDIRECT_URI,
                        code,
                        code_verifier: pkce.verifier,
                        grant_type: 'authorization_code'
                    })
                });

                if (!res.ok) {
                    const err = await res.json();
                    throw new Error(err.error_description || err.error);
                }

                const data = await res.json();
                auth.clientId = clientId;
                auth.accessToken = data.access_token;
                auth.refreshToken = data.refresh_token;
                auth.tokenExpiry = Date.now() + (data.expires_in * 1000);

                localStorage.setItem('simkl_auth', JSON.stringify(auth));
                localStorage.removeItem('simkl_pkce');

                $('#authModal').classList.add('hidden');
                updateUI();
                loadData();
            } catch (e) {
                showBanner(`Login gagal: ${e.message}`, 'error');
                showLoading(false);
            }
        }

        // ===== FETCH SIMKL (dengan auto-refresh token) =====
        async function fetchSimkl(endpoint) {
            if (!auth.accessToken) throw new Error('Tidak ada access token');

            const separator = endpoint.includes('?') ? '&' : '?';
            const url = `${SIMKL_BASE}${endpoint}${separator}client_id=${auth.clientId}&app-name=${APP_NAME}&app-version=${APP_VERSION}`;

            let res = await fetch(url, {
                headers: {
                    Authorization: `Bearer ${auth.accessToken}`,
                    'User-Agent': `${APP_NAME}/${APP_VERSION}`,
                    'simkl-api-key': auth.clientId
                }
            });

            if (res.status === 401 && auth.refreshToken) {
                try {
                    const refreshRes = await fetch(`${SIMKL_BASE}/oauth2/token`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            client_id: auth.clientId,
                            refresh_token: auth.refreshToken,
                            grant_type: 'refresh_token'
                        })
                    });
                    if (refreshRes.ok) {
                        const data = await refreshRes.json();
                        auth.accessToken = data.access_token;
                        auth.refreshToken = data.refresh_token;
                        auth.tokenExpiry = Date.now() + (data.expires_in * 1000);
                        localStorage.setItem('simkl_auth', JSON.stringify(auth));
                        res = await fetch(url, {
                            headers: {
                                Authorization: `Bearer ${auth.accessToken}`,
                                'User-Agent': `${APP_NAME}/${APP_VERSION}`,
                                'simkl-api-key': auth.clientId
                            }
                        });
                    } else {
                        throw new Error('Refresh token expired');
                    }
                } catch (e) {
                    throw new Error('Token expired, silakan login ulang');
                }
            }

            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            return res.json();
        }

        function loadAuth() {
            const stored = localStorage.getItem('simkl_auth');
            if (stored) {
                try { auth = JSON.parse(stored); } catch {}
            }
            if (!auth.clientId) {
                const savedClient = localStorage.getItem('simkl_client_id');
                if (savedClient) auth.clientId = savedClient;
            }
        }

        function updateUI() {
            const loggedIn = !!auth.accessToken;
            $('#statusBadge').className = `w-2 h-2 rounded-full ${loggedIn ? 'bg-green-500' : 'bg-red-500'}`;
            $('#statusText').textContent = loggedIn ? 'Terkoneksi SIMKL' : 'Belum login';
            $('#clientDisplay').textContent = loggedIn ? `Client: ${auth.clientId}` : '';
            $('#logoutBtn').style.display = loggedIn ? 'block' : 'none';
            $('#loginAgainBtn').style.display = loggedIn ? 'block' : 'none';
            if (auth.clientId) {
                $('#clientIdInput').value = auth.clientId;
            }
        }

        function showAuthStatus(msg, type = 'info') {
            const el = $('#authStatus');
            el.textContent = msg;
            el.className = `mt-3 text-xs text-center ${type === 'error' ? 'text-red-400' : 'text-green-400'}`;
            el.classList.remove('hidden');
        }

        function showBanner(msg, type = 'error') {
            const el = $('#authBanner');
            el.textContent = msg;
            el.className = `mb-4 p-3 rounded-lg text-sm ${type === 'error' ? 'bg-red-900/50 border border-red-700 text-red-300' : 'bg-green-900/50 border border-green-700 text-green-300'}`;
            el.classList.remove('hidden');
        }

        function showLoading(show) {
            $('#loadingState').classList.toggle('hidden', !show);
            $('#continueWatchingSection').classList.toggle('hidden', show);
            $('#watchlistSection').classList.toggle('hidden', show);
            $('#planToWatchSection').classList.toggle('hidden', show);
        }

        // ===== RENDER GRID (Ditambahkan kembali) =====
        function renderGrid(container, items) {
            container.innerHTML = '';
            items.forEach(item => {
                const rawObj = item.show || item.movie || item.anime || item;
                const title = rawObj.title || 'Unknown Title';
                const posterPath = rawObj.poster;
                const posterUrl = posterPath ? `https://simkl.in/posters/${posterPath}_m.jpg` : '';
                const simklId = rawObj.ids?.simkl;
                const type = item.type || (item.show ? 'show' : item.movie ? 'movie' : 'anime');

                const card = document.createElement('div');
                card.className = 'bg-slate-900 border border-slate-800 rounded-xl overflow-hidden cursor-pointer hover:border-indigo-500 transition group';
                card.innerHTML = `
                    <div class="aspect-[2/3] bg-slate-800 relative overflow-hidden">
                        ${posterUrl ? `<img src="${posterUrl}" alt="${title}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300" loading="lazy">` : '<div class="flex items-center justify-center h-full text-xs text-slate-500">No Poster</div>'}
                    </div>
                    <div class="p-2">
                        <p class="text-xs font-medium text-slate-200 truncate">${title}</p>
                    </div>
                `;
                
                card.addEventListener('click', () => {
                    selectedItem = { simklId, type, title, overview: rawObj.overview };
                    $('#modalTitle').textContent = title;
                    $('#modalType').textContent = type.toUpperCase();
                    $('#modalOverview').textContent = rawObj.overview || 'Memuat overview...';
                    $('#modalMetadata').innerHTML = '<p class="text-xs text-slate-400">Memuat detail...</p>';
                    $('#actionModal').classList.remove('hidden');
                    $('#actionModal').classList.add('flex');

                    if (simklId) {
                        loadDetail(simklId, type);
                    }
                });

                container.appendChild(card);
            });
        }

        // ===== LOAD DATA =====
        async function loadData() {
            if (!auth.accessToken) {
                showBanner('Login terlebih dahulu');
                showLoading(false);
                return;
            }

            showLoading(true);
            try {
                const [playback, allItems] = await Promise.allSettled([
                    fetchSimkl('/sync/playback'),
                    fetchSimkl('/sync/all-items?extended=full')
                ]);

                let cwItems = [];
                let wlItems = [];
                let ptwItems = [];

                if (playback.status === 'fulfilled' && playback.value) {
                    cwItems = [...(playback.value.shows || []), ...(playback.value.movies || [])].slice(0, 9);
                }

                const processItem = (item, type) => {
                    item.type = type;
                    if (item.status === 'watching') wlItems.push(item);
                    else if (item.status === 'plantowatch') ptwItems.push(item);
                };

                if (allItems.status === 'fulfilled' && allItems.value) {
                    const data = allItems.value;
                    (data.shows || []).forEach(item => processItem(item, 'show'));
                    (data.movies || []).forEach(item => processItem(item, 'movie'));
                    (data.anime || []).forEach(item => processItem(item, 'anime'));
                }

                const getTitle = i => (i.show || i.movie || i.anime || i)?.title || '';
                
                // Perbaikan assignment sort & slice
                cwItems = cwItems.sort((a, b) => getTitle(a).localeCompare(getTitle(b))).slice(0, 9);
                wlItems = wlItems.sort((a, b) => getTitle(a).localeCompare(getTitle(b))).slice(0, 9);
                ptwItems = ptwItems.sort((a, b) => getTitle(a).localeCompare(getTitle(b))).slice(0, 9);

                renderGrid($('#continueWatchingGrid'), cwItems);
                renderGrid($('#watchlistGrid'), wlItems);
                renderGrid($('#planToWatchGrid'), ptwItems);

                $('#continueWatchingSection').classList.toggle('hidden', cwItems.length === 0);
                $('#watchlistSection').classList.toggle('hidden', wlItems.length === 0);
                $('#planToWatchSection').classList.toggle('hidden', ptwItems.length === 0);
            } catch (e) {
                showBanner(`Error: ${e.message}`);
            } finally {
                showLoading(false);
            }
        }

        async function loadDetail(simklId, type) {
            const endpointMap = { show: 'tv', movie: 'movies', anime: 'anime' };
            const endpoint = endpointMap[type] || 'tv';

            try {
                const detail = await fetchSimkl(`/${endpoint}/${simklId}?extended=full`);
                if (!detail) return;

                const meta = $('#modalMetadata');
                if (!meta) return;

                let html = '';
                html += `<p class="text-sm text-slate-300 font-medium">${detail.title || ''} (${detail.year || ''})</p>`;
                if (detail.genres && detail.genres.length > 0) {
                    html += `<p class="text-xs text-slate-400 mt-1">${detail.genres.join(' • ')}</p>`;
                }
                if (detail.ratings) {
                    const ratings = [];
                    if (detail.ratings.simkl) ratings.push(`★ ${detail.ratings.simkl.rating}/10`);
                    if (detail.ratings.imdb) ratings.push(`IMDb ${detail.ratings.imdb.rating}/10`);
                    if (ratings.length > 0) html += `<p class="text-xs text-slate-400 mt-1">${ratings.join(' • ')}</p>`;
                }
                if (detail.runtime) html += `<p class="text-xs text-slate-500 mt-1">Duration: ${detail.runtime} min</p>`;
                if (detail.certification) html += `<span class="px-1.5 py-0.5 text-xs bg-slate-800 text-slate-300 rounded mt-1 inline-block">${detail.certification}</span>`;
                if (detail.network) html += `<p class="text-xs text-slate-500 mt-1">${detail.network}</p>`;
                if (detail.country) html += `<span class="px-1.5 py-0.5 text-xs bg-slate-800 text-slate-300 rounded mt-1 inline-block">${detail.country}</span>`;
                if (detail.original_language) html += `<p class="text-xs text-slate-500 mt-1">Language: ${detail.original_language.toUpperCase()}</p>`;

                if (detail.fanart) {
                    html += `<img src="https://simkl.in/fanart/${detail.fanart}_m.jpg" alt="fanart" class="mt-3 w-full rounded-lg object-cover h-40" onerror="this.style.display='none'">`;
                }

                meta.innerHTML = html || '<p class="text-slate-400 text-sm">No metadata available.</p>';
                if (detail.overview) {
                    $('#modalOverview').textContent = detail.overview;
                }
            } catch (e) {
                console.error('Failed to load detail:', e);
            }
        }

        function launchApp(appType) {
            if (!selectedItem) return;
            const title = selectedItem.title;
            const encodedQuery = encodeURIComponent(title);
            let intentUrl = '';

            switch(appType) {
                case 'stremio':
                    intentUrl = APP_INTENTS.stremio.replace('{q}', encodedQuery);
                    break;
                case 'nuvio':
                    intentUrl = APP_INTENTS.nuvio.replace('{q}', encodedQuery);
                    break;
                case 'cloudstream':
                    intentUrl = APP_INTENTS.cloudstream.replace('{q}', encodedQuery);
                    break;
                case 'netflix':
                    window.location.href = APP_INTENTS.netflix.replace('{q}', encodedQuery);
                    return;
            }
            window.location.href = intentUrl;
        }

        // ===== EVENT LISTENERS =====
        $('#settingsBtn').addEventListener('click', () => $('#settingsModal').classList.remove('hidden'));
        $('#closeSettings').addEventListener('click', () => $('#settingsModal').classList.add('hidden'));
        $('#loginBtn').addEventListener('click', startLogin);
        $('#logoutBtn').addEventListener('click', () => {
            localStorage.removeItem('simkl_auth');
            localStorage.removeItem('simkl_client_id');
            auth = { clientId: '', accessToken: '', refreshToken: '', tokenExpiry: 0 };
            updateUI();
            $('#settingsModal').classList.add('hidden');
            $('#authModal').classList.remove('hidden');
        });
        $('#loginAgainBtn').addEventListener('click', () => {
            $('#settingsModal').classList.add('hidden');
            $('#authModal').classList.remove('hidden');
        });
        $('#closeAuth').addEventListener('click', () => $('#authModal').classList.add('hidden'));
        $('#closeModal').addEventListener('click', () => $('#actionModal').classList.add('hidden'));
        
        $$('.app-btn').forEach(btn => {
            btn.addEventListener('click', () => launchApp(btn.dataset.app));
        });

        [$('#authModal'), $('#settingsModal'), $('#actionModal')].forEach(modal => {
            modal.addEventListener('click', e => {
                if (e.target === modal) modal.classList.add('hidden');
            });
        });

        document.addEventListener('keydown', e => {
            if (e.key === 'Escape') {
                $('#authModal').classList.add('hidden');
                $('#settingsModal').classList.add('hidden');
                $('#actionModal').classList.add('hidden');
            }
        });

        // ===== INIT =====
        loadAuth();
        if (window.location.search.includes('code=')) {
            handleCallback();
        } else {
            updateUI();
            if (auth.accessToken) {
                loadData();
            } else {
                $('#authModal').classList.remove('hidden');
            }
        }
    </script>
</body>
</html>
