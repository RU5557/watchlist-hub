<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f172a">
    <meta name="description" content="Watchlist Hub - Multi-app launcher for your SIMKL watchlist">
    <title>Watchlist Hub</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(() => {});
        }
    </script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans">
    <div class="max-w-4xl mx-auto p-4">
        <!-- Header -->
        <header class="flex justify-between items-center mb-6 border-b border-slate-800 pb-4">
            <h1 class="text-2xl font-bold bg-gradient-to-r from-indigo-400 to-cyan-400 bg-clip-text text-transparent">Watchlist Hub</h1>
            <button id="settingsBtn" class="bg-slate-800 px-3 py-1.5 rounded-lg text-sm hover:bg-slate-700 transition">Settings</button>
        </header>

        <!-- Auth Status / Error Banner -->
        <div id="authBanner" class="hidden mb-4 p-3 rounded-lg text-sm"></div>

        <!-- Loading State -->
        <div id="loadingState" class="hidden text-center py-12">
            <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-slate-700 border-t-indigo-400"></div>
            <p class="mt-3 text-slate-400">Memuat data dari SIMKL...</p>
        </div>

        <!-- Empty State -->
        <div id="emptyState" class="hidden text-center py-12">
            <svg class="mx-auto h-16 w-16 text-slate-700" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <p class="mt-3 text-slate-400">Tidak ada data. Periksa pengaturan SIMKL.</p>
        </div>

        <!-- Continue Watching Section -->
        <section id="continueWatchingSection" class="hidden mb-8">
            <div class="flex justify-between items-center mb-3">
                <h2 class="text-lg font-semibold text-slate-300">Continue Watching</h2>
                <span id="cwCount" class="text-xs text-slate-500 bg-slate-800 px-2 py-0.5 rounded">0</span>
            </div>
            <div id="continueWatchingGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4"></div>
        </section>

        <!-- Watchlist Section -->
        <section id="watchlistSection" class="hidden">
            <div class="flex justify-between items-center mb-3">
                <h2 class="text-lg font-semibold text-slate-300">My Watchlist</h2>
                <span id="wlCount" class="text-xs text-slate-500 bg-slate-800 px-2 py-0.5 rounded">0</span>
            </div>
            <div id="watchlistGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4"></div>
        </section>
    </div>

    <!-- Settings Modal -->
    <div id="settingsModal" class="fixed inset-0 bg-black/80 hidden items-center justify-center p-4 z-50">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-md w-full p-6 relative">
            <button id="closeSettings" class="absolute top-4 right-4 text-slate-400 hover:text-white text-2xl">&times;</button>
            <h3 class="text-xl font-bold mb-6">Pengaturan SIMKL</h3>
            <p class="text-sm text-slate-400 mb-6">Dapatkan Client ID & User Token di <a href="https://simkl.com/api/" target="_blank" class="text-indigo-400 hover:underline">simkl.com/api</a></p>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-1">Client ID</label>
                    <input type="text" id="clientIdInput" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent" placeholder="Masukkan Client ID">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-1">User Token (Optional)</label>
                    <input type="password" id="userTokenInput" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent" placeholder="Masukkan User Token (untuk watchlist pribadi)">
                </div>
            </div>
            <div class="mt-6 flex gap-3">
                <button id="saveSettings" class="flex-1 bg-indigo-600 hover:bg-indigo-500 py-2.5 px-4 rounded-xl font-medium text-sm transition">Simpan</button>
                <button id="clearSettings" class="px-4 py-2.5 bg-slate-700 hover:bg-slate-600 rounded-xl font-medium text-sm transition">Hapus</button>
            </div>
            <p id="settingsStatus" class="mt-3 text-xs text-center hidden"></p>
        </div>
    </div>

    <!-- Action Modal -->
    <div id="actionModal" class="fixed inset-0 bg-black/80 hidden items-center justify-center p-4 z-50">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-md w-full p-6 relative">
            <button id="closeModal" class="absolute top-4 right-4 text-slate-400 hover:text-white text-2xl">&times;</button>
            <div class="flex items-start gap-3">
                <img id="modalPoster" src="" alt="" class="w-24 h-36 object-cover rounded-lg flex-shrink-0 hidden">
                <div class="flex-1 min-w-0">
                    <h3 id="modalTitle" class="text-lg font-bold mb-1 truncate"></h3>
                    <p id="modalType" class="text-xs text-slate-400 mb-2"></p>
                    <p id="modalOverview" class="text-sm text-slate-400 line-clamp-3"></p>
                </div>
            </div>
            
            <div class="mt-6">
                <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-3">Buka & Cari di Aplikasi:</p>
                <div class="grid grid-cols-2 gap-3">
                    <button data-app="stremio" class="app-btn bg-indigo-600 hover:bg-indigo-500 py-2.5 px-4 rounded-xl font-medium text-sm transition">Stremio</button>
                    <button data-app="nuvio" class="app-btn bg-cyan-600 hover:bg-cyan-500 py-2.5 px-4 rounded-xl font-medium text-sm transition">Nuvio</button>
                    <button data-app="cloudstream" class="app-btn bg-emerald-600 hover:bg-emerald-500 py-2.5 px-4 rounded-xl font-medium text-sm transition">Cloudstream</button>
                    <button data-app="netflix" class="app-btn bg-red-600 hover:bg-red-500 py-2.5 px-4 rounded-xl font-medium text-sm transition">Netflix</button>
                    <button data-app="prime" class="app-btn bg-blue-600 hover:bg-blue-500 py-2.5 px-4 rounded-xl font-medium text-sm transition">Prime Video</button>
                    <button data-app="disney" class="app-btn bg-blue-700 hover:bg-blue-600 py-2.5 px-4 rounded-xl font-medium text-sm transition">Disney+</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ============ KONFIGURASI & STATE ============
        const SIMKL_BASE = 'https://api.simkl.com';
        const APP_CONFIG = {
            stremio: { pkg: 'com.stremio.one', color: 'indigo', scheme: 'intent://search?q={q}#Intent;package=com.stremio.one;end;' },
            nuvio: { pkg: 'com.nuvio.app', color: 'cyan', scheme: 'intent://search?q={q}#Intent;package=com.nuvio.app;end;' },
            cloudstream: { pkg: 'com.lagradost.cloudstream3', color: 'emerald', scheme: 'intent://search?q={q}#Intent;package=com.lagradost.cloudstream3;end;' },
            netflix: { pkg: null, color: 'red', web: 'https://www.netflix.com/search?q={q}' },
            prime: { pkg: 'com.amazon.amazonvideo.livingroom', color: 'blue', scheme: 'intent://search?q={q}#Intent;package=com.amazon.amazonvideo.livingroom;end;', web: 'https://www.primevideo.com/search?q={q}' },
            disney: { pkg: 'com.disney.disneyplus', color: 'blue-700', scheme: 'intent://search?q={q}#Intent;package=com.disney.disneyplus;end;', web: 'https://www.disneyplus.com/search?q={q}' }
        };

        let selectedItem = null;
        let auth = { clientId: '', userToken: '' };

        // ============ DOM ELEMENTS ============
        const $ = (sel) => document.querySelector(sel);
        const $$ = (sel) => document.querySelectorAll(sel);

        const authBanner = $('#authBanner');
        const loadingState = $('#loadingState');
        const emptyState = $('#emptyState');
        const cwSection = $('#continueWatchingSection');
        const wlSection = $('#watchlistSection');
        const cwGrid = $('#continueWatchingGrid');
        const wlGrid = $('#watchlistGrid');
        const cwCount = $('#cwCount');
        const wlCount = $('#wlCount');

        const settingsBtn = $('#settingsBtn');
        const settingsModal = $('#settingsModal');
        const closeSettings = $('#closeSettings');
        const clientIdInput = $('#clientIdInput');
        const userTokenInput = $('#userTokenInput');
        const saveSettings = $('#saveSettings');
        const clearSettings = $('#clearSettings');
        const settingsStatus = $('#settingsStatus');

        const actionModal = $('#actionModal');
        const closeModal = $('#closeModal');
        const modalPoster = $('#modalPoster');
        const modalTitle = $('#modalTitle');
        const modalType = $('#modalType');
        const modalOverview = $('#modalOverview');

        // ============ UTILITAS ============
        function showBanner(msg, type = 'error') {
            authBanner.textContent = msg;
            authBanner.className = `mb-4 p-3 rounded-lg text-sm ${type === 'error' ? 'bg-red-900/50 border border-red-700 text-red-300' : 'bg-green-900/50 border border-green-700 text-green-300'}`;
            authBanner.classList.remove('hidden');
        }

        function hideBanner() {
            authBanner.classList.add('hidden');
        }

        function setLoading(show) {
            loadingState.classList.toggle('hidden', !show);
            cwSection.classList.toggle('hidden', show);
            wlSection.classList.toggle('hidden', show);
            emptyState.classList.add('hidden');
        }

        function setEmpty(show) {
            emptyState.classList.toggle('hidden', !show);
            cwSection.classList.add('hidden');
            wlSection.classList.add('hidden');
            loadingState.classList.add('hidden');
        }

        function escapeHtml(str) {
            return str.replace(/[&<>"']/g, c => ({'&':'&','<':'<','>':'>','"':'"',"'":'''}[c]));
        }

        function getPosterUrl(item) {
            if (item.poster) return item.poster;
            if (item.ids?.tmdb) return `https://image.tmdb.org/t/p/w342${item.ids.tmdb}`;
            if (item.ids?.tvdb) return `https://artworks.thetvdb.com/banners/posters/${item.ids.tvdb}-1.jpg`;
            return '';
        }

        function formatType(type) {
            return type === 'show' ? 'TV Series' : type === 'anime' ? 'Anime' : 'Movie';
        }

        // ============ AUTH & STORAGE ============
        function loadAuth() {
            const stored = localStorage.getItem('simkl_auth');
            if (stored) {
                try {
                    auth = JSON.parse(stored);
                    clientIdInput.value = auth.clientId || '';
                    userTokenInput.value = auth.userToken || '';
                } catch {}
            }
        }

        function saveAuth() {
            auth.clientId = clientIdInput.value.trim();
            auth.userToken = userTokenInput.value.trim();
            localStorage.setItem('simkl_auth', JSON.stringify(auth));
            settingsStatus.textContent = 'Tersimpan!';
            settingsStatus.className = 'mt-3 text-xs text-center text-green-400';
            settingsStatus.classList.remove('hidden');
            setTimeout(() => { settingsStatus.classList.add('hidden'); hideBanner(); loadData(); }, 1000);
        }

        function clearAuth() {
            auth = { clientId: '', userToken: '' };
            localStorage.removeItem('simkl_auth');
            clientIdInput.value = '';
            userTokenInput.value = '';
            settingsStatus.textContent = 'Dihapus';
            settingsStatus.className = 'mt-3 text-xs text-center text-yellow-400';
            settingsStatus.classList.remove('hidden');
            setTimeout(() => settingsStatus.classList.add('hidden'), 1000);
            cwGrid.innerHTML = '';
            wlGrid.innerHTML = '';
            cwSection.classList.add('hidden');
            wlSection.classList.add('hidden');
            emptyState.classList.remove('hidden');
        }

        function getHeaders() {
            const h = { 'Content-Type': 'application/json', 'simkl-api-key': auth.clientId };
            if (auth.userToken) h.Authorization = `Bearer ${auth.userToken}`;
            return h;
        }

        // ============ FETCH DATA ============
        async function fetchSimkl(endpoint) {
            const res = await fetch(`${SIMKL_BASE}${endpoint}`, { headers: getHeaders() });
            if (!res.ok) {
                const err = await res.json().catch(() => ({}));
                throw new Error(err.error || `HTTP ${res.status}`);
            }
            return res.json();
        }

        async function loadData() {
            if (!auth.clientId) {
                showBanner('Masukkan Client ID SIMKL di Settings');
                setEmpty(true);
                return;
            }
            hideBanner();
            setLoading(true);

            try {
                const [activities, watchlist] = await Promise.allSettled([
                    fetchSimkl('/sync/activities?limit=50&extended=full'),
                    fetchSimkl('/sync/all-items?extended=full')
                ]);

                let cwItems = [];
                let wlItems = [];

                if (activities.status === 'fulfilled') {
                    cwItems = parseContinueWatching(activities.value);
                } else {
                    console.error('Activities error:', activities.reason);
                }

                if (watchlist.status === 'fulfilled') {
                    wlItems = parseWatchlist(watchlist.value);
                } else {
                    console.error('Watchlist error:', watchlist.reason);
                }

                renderGrid(cwGrid, cwItems);
                renderGrid(wlGrid, wlItems);
                cwCount.textContent = cwItems.length;
                wlCount.textContent = wlItems.length;

                cwSection.classList.toggle('hidden', cwItems.length === 0);
                wlSection.classList.toggle('hidden', wlItems.length === 0);
                emptyState.classList.toggle('hidden', cwItems.length > 0 || wlItems.length > 0);

            } catch (e) {
                showBanner(`Error: ${e.message}`);
                setEmpty(true);
            } finally {
                setLoading(false);
            }
        }

        function parseContinueWatching(data) {
            const items = [];
            if (data.shows) {
                data.shows.forEach(s => {
                    if (s.last_watched_at && s.next_episode) {
                        items.push({
                            type: s.show?.type || 'show',
                            title: s.show?.title || s.title,
                            overview: s.show?.overview || '',
                            poster: getPosterUrl(s.show),
                            ids: s.show?.ids || {},
                            progress: s.next_episode?.number || 0,
                            season: s.next_episode?.season || 0,
                            episodeTitle: s.next_episode?.title || '',
                            year: s.show?.year,
                            lastWatched: s.last_watched_at
                        });
                    }
                });
            }
            if (data.movies) {
                data.movies.forEach(m => {
                    if (m.last_watched_at && m.progress && m.progress < 100) {
                        items.push({
                            type: 'movie',
                            title: m.movie?.title || m.title,
                            overview: m.movie?.overview || '',
                            poster: getPosterUrl(m.movie),
                            ids: m.movie?.ids || {},
                            progress: m.progress,
                            year: m.movie?.year,
                            lastWatched: m.last_watched_at
                        });
                    }
                });
            }
            return items.sort((a, b) => new Date(b.lastWatched) - new Date(a.lastWatched));
        }

        function parseWatchlist(data) {
            const items = [];
            const addItems = (arr, type) => {
                arr?.forEach(w => {
                    const item = w.show || w.movie || w.anime || w;
                    if (item?.title) {
                        items.push({
                            type: type,
                            title: item.title,
                            overview: item.overview || '',
                            poster: getPosterUrl(item),
                            ids: item.ids || {},
                            year: item.year
                        });
                    }
                });
            };
            addItems(data.shows, 'show');
            addItems(data.movies, 'movie');
            addItems(data.anime, 'anime');
            return items;
        }

        // ============ RENDER ============
        function renderGrid(grid, items) {
            grid.innerHTML = items.map(item => `
                <article class="group relative bg-slate-900 border border-slate-800 rounded-xl overflow-hidden hover:border-indigo-500/50 transition cursor-pointer" data-title="${escapeHtml(item.title)}" data-overview="${escapeHtml(item.overview)}" data-poster="${escapeHtml(item.poster)}" data-type="${item.type}">
                    <div class="aspect-[2/3] relative overflow-hidden">
                        <img src="${item.poster || 'https://via.placeholder.com/300x450/1e293b/64748b?text=No+Image'}" alt="${escapeHtml(item.title)}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300" loading="lazy">
                        ${item.progress ? `<div class="absolute bottom-0 left-0 right-0 h-1.5 bg-slate-800"><div class="h-full bg-indigo-500" style="width:${Math.min(item.progress, 100)}%"></div></div>` : ''}
                        <div class="absolute top-2 right-2">
                            <span class="px-1.5 py-0.5 text-xs font-medium rounded bg-black/80 backdrop-blur text-white">${formatType(item.type)}</span>
                        </div>
                    </div>
                    <div class="p-3">
                        <h4 class="font-medium text-sm truncate group-hover:text-indigo-300 transition">${escapeHtml(item.title)}</h4>
                        ${item.year ? `<p class="text-xs text-slate-500">${item.year}</p>` : ''}
                        ${item.episodeTitle ? `<p class="text-xs text-slate-400 truncate mt-1">S${item.season}E${item.progress} • ${escapeHtml(item.episodeTitle)}</p>` : ''}
                    </div>
                </article>
            `).join('');

            grid.querySelectorAll('article').forEach(card => {
                card.addEventListener('click', () => openActionModal({
                    title: card.dataset.title,
                    overview: card.dataset.overview,
                    poster: card.dataset.poster,
                    type: card.dataset.type
                }));
            });
        }

        // ============ MODAL ACTION ============
        function openActionModal(item) {
            selectedItem = item;
            modalTitle.textContent = item.title;
            modalType.textContent = formatType(item.type);
            modalOverview.textContent = item.overview || 'Tidak ada deskripsi.';
            if (item.poster) {
                modalPoster.src = item.poster;
                modalPoster.classList.remove('hidden');
            } else {
                modalPoster.classList.add('hidden');
            }
            actionModal.classList.remove('hidden');
            actionModal.classList.add('flex');
        }

        function closeActionModal() {
            actionModal.classList.add('hidden');
            actionModal.classList.remove('flex');
            selectedItem = null;
        }

        function launchApp(appKey) {
            if (!selectedItem) return;
            const cfg = APP_CONFIG[appKey];
            const query = encodeURIComponent(selectedItem.title);
            let url = '';

            if (cfg.scheme) {
                url = cfg.scheme.replace('{q}', query);
            } else if (cfg.web) {
                url = cfg.web.replace('{q}', query);
            }

            if (url) {
                window.location.href = url;
                closeActionModal();
            }
        }

        // ============ EVENT LISTENERS ============
        settingsBtn.addEventListener('click', () => {
            settingsModal.classList.remove('hidden');
            settingsModal.classList.add('flex');
        });

        closeSettings.addEventListener('click', () => {
            settingsModal.classList.add('hidden');
            settingsModal.classList.remove('flex');
        });

        saveSettings.addEventListener('click', saveAuth);
        clearSettings.addEventListener('click', clearAuth);

        closeModal.addEventListener('click', closeActionModal);

        $$('.app-btn').forEach(btn => {
            btn.addEventListener('click', () => launchApp(btn.dataset.app));
        });

        // Close modals on backdrop click
        [settingsModal, actionModal].forEach(modal => {
            modal.addEventListener('click', e => {
                if (e.target === modal) {
                    modal.classList.add('hidden');
                    modal.classList.remove('flex');
                }
            });
        });

        // ESC key to close
        document.addEventListener('keydown', e => {
            if (e.key === 'Escape') {
                closeActionModal();
                settingsModal.classList.add('hidden');
                settingsModal.classList.remove('flex');
            }
        });

        // ============ INIT ============
        loadAuth();
        if (auth.clientId) loadData();
    </script>
</body>
</html>
